<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slushify Owner Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; background: #070a1f; color: #fff; overflow-x: hidden; }
    .orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: .4; animation: float 14s ease-in-out infinite; pointer-events: none; }
    .orb1 { width: 460px; height: 460px; background: #5b1fa6; top: -140px; right: -120px; }
    .orb2 { width: 380px; height: 380px; background: #ff4fb8; bottom: -140px; left: -120px; animation-delay: -6s; }
    @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,30px) scale(1.1); } }

    header {
      position: relative; z-index: 2; padding: 30px 24px;
      background: linear-gradient(120deg, rgba(13,17,45,.9), rgba(53,21,116,.55) 60%, rgba(255,79,184,.28));
      border-bottom: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(16px);
    }
    .wrap { width: min(1180px, 100%); margin: 0 auto; padding: 0 6px; }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    .pill { display: inline-block; padding: 7px 16px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 2px;
      background: rgba(101,244,255,.12); color: #65f4ff; border: 1px solid rgba(101,244,255,.35); }
    h1 { margin: 10px 0 6px; font-size: clamp(30px, 5vw, 54px); letter-spacing: -2px;
      background: linear-gradient(120deg, #fff 30%, #65f4ff 70%, #ff4fb8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #state { color: #93a2cc; font-size: 14px; }

    main { position: relative; z-index: 2; width: min(1180px, 100%); margin: 0 auto; padding: 26px 6px 60px; perspective: 1400px; }

    button { border: 0; border-radius: 16px; padding: 13px 22px; font-weight: 800; cursor: pointer; font-size: 14px;
      background: linear-gradient(145deg, #65f4ff, #0891b2); color: #04121c;
      box-shadow: 0 14px 28px -10px rgba(101,244,255,.6), inset 0 2px 4px rgba(255,255,255,.5); transition: transform .15s ease, box-shadow .15s ease; }
    button:hover { transform: translateY(-3px); box-shadow: 0 20px 34px -10px rgba(101,244,255,.7); }
    button:active { transform: translateY(0); }
    button.dark { background: linear-gradient(145deg, #232a56, #141a3d); color: #dfe6ff; box-shadow: 0 14px 28px -12px rgba(0,0,0,.7), inset 0 1px 3px rgba(255,255,255,.15); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin: 26px 0; }
    .card {
      border-radius: 26px; padding: 24px; position: relative; transform-style: preserve-3d; transition: transform .2s ease;
      background: linear-gradient(150deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(14px);
      box-shadow: 0 26px 50px -18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.15);
    }
    .card:hover { transform: translateY(-6px) rotateX(4deg); }
    .card span { color: #93a2cc; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
    .metric { font-size: 40px; font-weight: 900; margin-top: 12px; letter-spacing: -1px;
      background: linear-gradient(120deg, #65f4ff, #a5f3fc); -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 14px 40px rgba(101,244,255,.25); }
    .card.alert .metric { background: linear-gradient(120deg, #ff4fb8, #ff9ad2); -webkit-background-clip: text; background-clip: text; }

    .panel { display: grid; grid-template-columns: 1.25fr .85fr; gap: 20px; align-items: start; }
    .panel h2 { font-size: 18px; margin-bottom: 14px; color: #dfe6ff; letter-spacing: -.3px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 12px; border-bottom: 1px solid rgba(255,255,255,.07); text-align: left; font-size: 14px; }
    th { color: #65f4ff; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; }
    tr { transition: background .15s ease; }
    tbody tr:hover { background: rgba(101,244,255,.05); }
    .finished { color: #ff7898; font-weight: 900; }
    .avail { color: #6ee7b7; font-weight: 700; }

    .notice { display: grid; gap: 12px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
    .notice::-webkit-scrollbar { width: 6px; } .notice::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
    .notice article { padding: 14px 16px; border-radius: 18px; background: rgba(255,79,184,.1); border: 1px solid rgba(255,79,184,.25);
      box-shadow: 0 12px 26px -14px rgba(255,79,184,.4); }
    .notice article strong { color: #ff9ad2; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .notice article p { margin: 6px 0 4px; font-size: 14px; }
    .notice article small { color: #7c89b5; font-size: 11px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(4,6,20,.8); backdrop-filter: blur(8px); place-items: center; padding: 20px; z-index: 50; }
    .modal.open { display: grid; }
    .login { width: min(420px, 100%); padding: 32px; border-radius: 28px; transform-style: preserve-3d;
      background: linear-gradient(150deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.15); box-shadow: 0 40px 90px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.2); }
    .login h2 { margin-bottom: 18px; letter-spacing: -.5px; }
    label { display: block; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #93a2cc; }
    input { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(4,6,20,.7); color: #fff; margin: 8px 0 16px; font-size: 15px; outline: none; transition: border .15s ease, box-shadow .15s ease; }
    input:focus { border-color: #65f4ff; box-shadow: 0 0 0 4px rgba(101,244,255,.15); }
    @media (max-width: 860px) { .panel { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="orb orb1"></div><div class="orb orb2"></div>

  <header>
    <div class="wrap top">
      <div>
        <span class="pill">OWNER SIDE</span>
        <h1>Live Control</h1>
        <p id="state">Login required</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button onclick="openLogin()">Owner Login</button>
        <button class="dark" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid">
      <div class="card"><span>Total Items</span><div class="metric" id="inventoryCount">0</div></div>
      <div class="card"><span>Inventory Value</span><div class="metric" id="inventoryValue">$0.00</div></div>
      <div class="card"><span>Finished Items</span><div class="metric" id="finishedItems">0</div></div>
      <div class="card alert"><span>Unread Alerts</span><div class="metric" id="unreadNotifications">0</div></div>
    </section>

    <section class="panel">
      <div class="card">
        <h2>Live Menu / Inventory</h2>
        <table>
          <thead><tr><th>Item name</th><th>Category</th><th>Qty</th><th>Price</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="inventoryRows"></tbody>
        </table>
      </div>
      <div class="card">
        <div class="top" style="margin-bottom:14px;"><h2 style="margin:0;">Notifications</h2><button class="dark" onclick="markRead()">Mark read</button></div>
        <div class="notice" id="notifications"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="loginModal">
    <form class="login" onsubmit="event.preventDefault(); login();">
      <h2>Owner Login</h2>
      <label>Owner ID</label>
      <input id="loginId" value="owner1" required>
      <label>Password</label>
      <input id="loginPass" type="password" required>
      <button type="submit" style="width:100%;">Login</button>
    </form>
  </div>

  <script>
    let token = localStorage.getItem('slushifyOwnerToken') || '';
    let lastUnread = 0;
    const money = value => `$${(Number(value) || 0).toFixed(2)}`;
    const auth = () => ({ 'X-Auth-Token': token });
    function openLogin() { document.getElementById('loginModal').classList.add('open'); }
    function closeLogin() { document.getElementById('loginModal').classList.remove('open'); }
    function logout() { token = ''; localStorage.removeItem('slushifyOwnerToken'); window.location.href = '/'; }

    async function login() {
      const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: loginId.value, pass: loginPass.value }) });
      const data = await response.json();
      if (!data.success || data.role !== 'owner') return alert('Owner login failed');
      token = data.token;
      localStorage.setItem('slushifyOwnerToken', token);
      closeLogin();
      loadData();
    }

    async function loadData() {
      if (!token) return openLogin();
      const statusResponse = await fetch('/api/status', { headers: auth() });
      if (statusResponse.status === 401) return logout();
      const status = await statusResponse.json();
      inventoryCount.textContent = status.inventoryCount;
      inventoryValue.textContent = money(status.inventoryValue);
      finishedItems.textContent = status.finishedItems;
      unreadNotifications.textContent = status.unreadNotifications;
      state.textContent = `Live as owner. Last update ${new Date().toLocaleTimeString()}`;

      const inventory = await (await fetch('/api/inventory', { headers: auth() })).json();
      inventoryRows.innerHTML = inventory.map(item => {
        const qty = Number(item.quantity) || 0;
        return `<tr><td>${item.name}</td><td>${item.category}</td><td>${qty}</td><td>${money(item.price)}</td><td>${money(qty * item.price)}</td><td>${qty <= 0 ? '<span class="finished">Finished</span>' : '<span class="avail">Available</span>'}</td></tr>`;
      }).join('') || '<tr><td colspan="6">No items yet</td></tr>';

      const alerts = await (await fetch('/api/notifications', { headers: auth() })).json();
      notifications.innerHTML = alerts.slice(0, 12).map(alert => `<article><strong>${alert.read ? '' : 'NEW  '}${alert.type}</strong><p>${alert.message}</p><small>${new Date(alert.createdAt).toLocaleString()}</small></article>`).join('') || '<p style="color:#7c89b5;">No notifications yet</p>';

      if (status.unreadNotifications > lastUnread && lastUnread !== 0) {
        if ('Notification' in window && Notification.permission === 'granted') new Notification('Slushify alert', { body: 'New inventory notification' });
      }
      lastUnread = status.unreadNotifications;
    }

    async function markRead() {
      await fetch('/api/notifications/read', { method: 'PATCH', headers: auth() });
      loadData();
    }

    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    setInterval(loadData, 4000);
    loadData();
  </script>
</body>
</html>
